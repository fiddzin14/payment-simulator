<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" rx="24" fill="#faf9ff"/><text x="36" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="bold" fill="#3639b8">ALUR PEMBAYARAN / LARAVEL KE LARAVEL</text><text x="36" y="59" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#626b81">QRIS dinamis, virtual account, dan signed webhook. Seluruh transaksi sandbox.</text><rect x="18" y="82" width="204" height="54" rx="12" fill="#efedff"/><text x="120" y="115" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#19223d">Klien</text><path d="M120 143V661" stroke="#cfcbe8" stroke-dasharray="5 7"/><rect x="338" y="82" width="204" height="54" rx="12" fill="#efedff"/><text x="440" y="115" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#19223d">Lumen Studio</text><path d="M440 143V661" stroke="#cfcbe8" stroke-dasharray="5 7"/><rect x="658" y="82" width="204" height="54" rx="12" fill="#5154ed"/><text x="760" y="115" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="white">Gateway Laravel</text><path d="M760 143V661" stroke="#cfcbe8" stroke-dasharray="5 7"/><rect x="978" y="82" width="204" height="54" rx="12" fill="#efedff"/><text x="1080" y="115" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#19223d">Ponsel</text><path d="M1080 143V661" stroke="#cfcbe8" stroke-dasharray="5 7"/><rect x="132" y="152" width="296" height="23" rx="5" fill="#faf9ff"/><text x="280" y="168" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">1. Pilih paket, booking tanggal dan waktu</text><path d="M120 180H440" stroke="#5154ed" stroke-width="2"/><path d="M440 180l-9 -5v10z" fill="#5154ed"/><rect x="452" y="198" width="296" height="23" rx="5" fill="#faf9ff"/><text x="600" y="214" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">2. POST /v1/payments + API key + Idempotency-Key</text><path d="M440 226H760" stroke="#5154ed" stroke-width="2"/><path d="M760 226l-9 -5v10z" fill="#5154ed"/><rect x="452" y="244" width="296" height="23" rx="5" fill="#faf9ff"/><text x="600" y="260" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">3. Payment ID, QR URL / VA, nominal dan expiry</text><path d="M760 272H440" stroke="#5154ed" stroke-width="2"/><path d="M440 272l9 -5v10z" fill="#5154ed"/><rect x="132" y="290" width="296" height="23" rx="5" fill="#faf9ff"/><text x="280" y="306" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">4. Tampilkan instruksi DP / pelunasan</text><path d="M440 318H120" stroke="#5154ed" stroke-width="2"/><path d="M120 318l9 -5v10z" fill="#5154ed"/><rect x="132" y="336" width="936" height="23" rx="5" fill="#faf9ff"/><text x="600" y="352" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">5. Scan QR menggunakan kamera ponsel</text><path d="M120 364H1080" stroke="#5154ed" stroke-width="2"/><path d="M1080 364l-9 -5v10z" fill="#5154ed"/><rect x="772" y="382" width="296" height="23" rx="5" fill="#faf9ff"/><text x="920" y="398" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">6. GET /qris/{token}</text><path d="M1080 410H760" stroke="#5154ed" stroke-width="2"/><path d="M760 410l9 -5v10z" fill="#5154ed"/><rect x="772" y="428" width="296" height="23" rx="5" fill="#faf9ff"/><text x="920" y="444" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">7. Receipt satu kali, konfirmasi pembayaran</text><path d="M760 456H1080" stroke="#5154ed" stroke-width="2"/><path d="M1080 456l-9 -5v10z" fill="#5154ed"/><rect x="452" y="474" width="296" height="23" rx="5" fill="#faf9ff"/><text x="600" y="490" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">8. POST payment.paid + signature HMAC</text><path d="M760 502H440" stroke="#dd526f" stroke-width="2"/><path d="M440 502l9 -5v10z" fill="#dd526f"/><rect x="452" y="520" width="296" height="23" rx="5" fill="#faf9ff"/><text x="600" y="536" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">9. GET status provider; cocokkan merchant dan nominal</text><path d="M440 548H760" stroke="#5154ed" stroke-width="2"/><path d="M760 548l-9 -5v10z" fill="#5154ed"/><rect x="452" y="566" width="296" height="23" rx="5" fill="#faf9ff"/><text x="600" y="582" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">10. Status paid, merchant dan nominal valid</text><path d="M760 594H440" stroke="#5154ed" stroke-width="2"/><path d="M440 594l9 -5v10z" fill="#5154ed"/><rect x="132" y="612" width="296" height="23" rx="5" fill="#faf9ff"/><text x="280" y="628" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#30385a">11. Booking terkonfirmasi + kuitansi PDF</text><path d="M440 640H120" stroke="#5154ed" stroke-width="2"/><path d="M120 640l9 -5v10z" fill="#5154ed"/><rect x="28" y="668" width="1144" height="52" rx="12" fill="#fff2de"/><text x="48" y="689" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#795c29">Gateway: lock transaksi, receipt unik, antrean event, retry via cron. Lumen: inbox, verifikasi status, kredit atomik.</text><text x="48" y="709" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#795c29">VA menggunakan bank simulator untuk transfer nominal tepat. Redirect browser saja tidak mengonfirmasi booking.</text></svg>